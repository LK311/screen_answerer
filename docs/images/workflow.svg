<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="300" fill="#f8fafc"/>

  <!-- 1. 定时截屏 -->
  <rect x="30" y="100" width="150" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">定时截屏</text>
  <text x="105" y="152" text-anchor="middle" font-size="12" fill="#3b5bb5">监控指定屏幕区域</text>

  <!-- 2. 变化检测 -->
  <rect x="220" y="100" width="160" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">画面变化检测</text>
  <text x="300" y="152" text-anchor="middle" font-size="12" fill="#3b5bb5">dHash / aHash / pHash</text>

  <!-- 3. 判断 -->
  <polygon points="440,136 490,106 540,136 490,166" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="490" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">有变化且</text>
  <text x="490" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">冷却结束？</text>

  <!-- 4. 大模型 -->
  <rect x="580" y="100" width="170" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="665" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">调用大模型分析</text>
  <text x="665" y="144" text-anchor="middle" font-size="11.5" fill="#166534">视觉模型直读截图</text>
  <text x="665" y="160" text-anchor="middle" font-size="11.5" fill="#166534">或 图像转文字 二段式</text>

  <!-- 5. 展示 -->
  <rect x="790" y="100" width="150" height="72" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="865" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#581c87">回答展示</text>
  <text x="865" y="144" text-anchor="middle" font-size="11.5" fill="#7e22ce">桌面浮窗 / 任务栏文本条</text>
  <text x="865" y="160" text-anchor="middle" font-size="11.5" fill="#7e22ce">超长回答逐行轮播</text>

  <!-- 主流程箭头 -->
  <line x1="180" y1="136" x2="218" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="136" x2="436" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="136" x2="576" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="136" x2="786" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 无变化回环 -->
  <path d="M 490 166 L 490 230 L 105 230 L 105 176" fill="none" stroke="#94a3b8" stroke-width="1.8"
        stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="300" y="222" text-anchor="middle" font-size="12" fill="#64748b">无变化：等待下一个监控间隔，重新截屏</text>

  <!-- 存档支线 -->
  <path d="M 665 172 L 665 246" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="580" y="250" width="170" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="665" y="274" text-anchor="middle" font-size="12" fill="#166534">问答存档 QA_History/&lt;日期&gt;/</text>

  <!-- 手动触发支线 -->
  <path d="M 105 100 L 105 56 L 440 56 L 440 100" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="272" y="48" text-anchor="middle" font-size="12" fill="#2563eb">手动回答（快捷键 / 托盘菜单：跳过变化检测，立即分析）</text>
</svg>
